<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="출발지와 도착지를 검색하고 자동차 경로의 거리를 확인해 보세요."
    />
    <meta name="theme-color" content="#f5f7f4" />
    <title>목적없이 떠나고 싶은날 — 거리 측정</title>
    <link rel="preconnect" href="https://nominatim.openstreetmap.org" />
    <link rel="preconnect" href="https://router.project-osrm.org" />
    <style>
      :root {
        color-scheme: light;
        --ink: #17251e;
        --muted: #718078;
        --green: #2f704e;
        --green-dark: #245a3d;
        --line: #e4e9e4;
        --surface: #ffffff;
        --canvas: #f5f7f4;
        --error: #b5473c;
        font-family:
          "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 50% 0%, #e8f0e8 0, transparent 38rem),
          var(--canvas);
      }

      button,
      input {
        font: inherit;
      }

      .page {
        width: min(100% - 40px, 600px);
        margin: 0 auto;
        padding: 62px 0 32px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--green);
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        display: grid;
        width: 31px;
        height: 31px;
        place-items: center;
        border-radius: 10px;
        background: #e4eee5;
      }

      .brand-mark svg {
        width: 17px;
        height: 17px;
      }

      header {
        margin-bottom: 30px;
      }

      h1 {
        margin: 23px 0 8px;
        font-size: clamp(29px, 7vw, 39px);
        font-weight: 760;
        letter-spacing: -0.055em;
        line-height: 1.22;
      }

      .intro {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .card {
        padding: 26px;
        border: 1px solid rgba(228, 233, 228, 0.9);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 18px 55px rgba(32, 58, 39, 0.07);
      }

      .field {
        position: relative;
      }

      .field + .field {
        margin-top: 21px;
      }

      .field label {
        display: block;
        margin-bottom: 9px;
        color: #48564e;
        font-size: 13px;
        font-weight: 700;
      }

      .input-wrap {
        position: relative;
      }

      .field-icon {
        position: absolute;
        top: 50%;
        left: 15px;
        width: 18px;
        height: 18px;
        color: #849188;
        pointer-events: none;
        transform: translateY(-50%);
      }

      .field-icon.destination {
        color: var(--green);
      }

      input {
        width: 100%;
        height: 54px;
        padding: 0 48px;
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: none;
        color: var(--ink);
        background: #fff;
        font-size: 15px;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease;
      }

      input::placeholder {
        color: #a0aaa3;
      }

      input:focus {
        border-color: #77a486;
        box-shadow: 0 0 0 3px rgba(47, 112, 78, 0.11);
      }

      .clear-button {
        position: absolute;
        top: 50%;
        right: 12px;
        display: none;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: #738078;
        background: transparent;
        cursor: pointer;
        transform: translateY(-50%);
      }

      .clear-button.visible {
        display: grid;
        place-items: center;
      }

      .clear-button:hover {
        background: #f0f3f0;
      }

      .connector {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 23px;
        height: 37px;
        border-left: 1px dashed #cbd5cd;
        pointer-events: none;
      }

      .suggestions {
        position: absolute;
        z-index: 3;
        top: calc(100% + 6px);
        right: 0;
        left: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 12px 30px rgba(23, 37, 30, 0.12);
      }

      .suggestions[hidden] {
        display: none;
      }

      .suggestion {
        display: block;
        width: 100%;
        padding: 12px 15px;
        border: 0;
        border-bottom: 1px solid #f0f2f0;
        color: var(--ink);
        background: #fff;
        cursor: pointer;
        text-align: left;
      }

      .suggestion:last-child {
        border-bottom: 0;
      }

      .suggestion:hover,
      .suggestion:focus-visible {
        outline: none;
        background: #f5f8f5;
      }

      .suggestion-name {
        display: block;
        overflow: hidden;
        font-size: 14px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .suggestion-detail {
        display: block;
        overflow: hidden;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .field-hint {
        min-height: 17px;
        margin: 7px 2px 0;
        color: var(--muted);
        font-size: 12px;
      }

      .field-hint.error {
        color: var(--error);
      }

      .submit-button {
        display: flex;
        width: 100%;
        height: 54px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-top: 6px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: var(--green);
        cursor: pointer;
        font-size: 15px;
        font-weight: 720;
        transition:
          background 150ms ease,
          transform 150ms ease;
      }

      .submit-button:hover:not(:disabled) {
        background: var(--green-dark);
        transform: translateY(-1px);
      }

      .submit-button:disabled {
        cursor: not-allowed;
        opacity: 0.62;
      }

      .submit-button svg {
        width: 18px;
        height: 18px;
      }

      .result {
        margin-top: 16px;
        padding: 24px 26px;
        border: 1px solid #dfe9df;
        border-radius: 18px;
        background: linear-gradient(135deg, #f1f7f0, #f9fbf8);
        animation: arrive 220ms ease both;
      }

      .result[hidden] {
        display: none;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result-label {
        color: #58715e;
        font-size: 12px;
        font-weight: 700;
      }

      .distance-line {
        display: flex;
        align-items: baseline;
        gap: 7px;
        margin-top: 7px;
      }

      .distance-value {
        font-size: clamp(36px, 9vw, 48px);
        font-weight: 760;
        letter-spacing: -0.06em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }

      .distance-unit {
        color: #58715e;
        font-size: 17px;
        font-weight: 650;
      }

      .route-summary {
        overflow: hidden;
        margin: 11px 0 0;
        color: #64746a;
        font-size: 13px;
        line-height: 1.6;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .map-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 19px;
        color: var(--green-dark);
        font-size: 14px;
        font-weight: 720;
        text-decoration: none;
      }

      .map-link:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .map-link svg {
        width: 17px;
        height: 17px;
      }

      .status {
        min-height: 20px;
        margin: 13px 2px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .status.error {
        color: var(--error);
      }

      .spinner {
        width: 17px;
        height: 17px;
        border: 2px solid rgba(255, 255, 255, 0.42);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      footer {
        margin-top: 23px;
        color: #869189;
        font-size: 11px;
        line-height: 1.8;
        text-align: center;
      }

      footer a {
        color: #65756a;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      @media (max-width: 520px) {
        .page {
          width: min(100% - 32px, 600px);
          padding-top: 38px;
        }

        .card {
          padding: 21px 18px;
          border-radius: 17px;
        }

        .result {
          padding: 21px 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.8" />
            </svg>
          </span>
          목적없이 떠나고 싶은날
        </div>
        <h1>두 장소 사이,<br />얼마나 멀까요?</h1>
        <p class="intro">
          장소 이름을 검색해 선택하면 자동차 경로의<br class="mobile-break" />
          거리를 알려드려요.
        </p>
      </header>

      <form class="card" id="route-form" novalidate>
        <div class="field" id="origin-field">
          <label for="origin-input">출발지</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.8" />
              <circle cx="12" cy="12" r="2.5" fill="currentColor" />
            </svg>
            <input
              id="origin-input"
              type="text"
              placeholder="예: 서울역"
              autocomplete="off"
              aria-autocomplete="list"
              aria-controls="origin-suggestions"
              aria-describedby="origin-hint"
            />
            <button class="clear-button" type="button" aria-label="출발지 지우기">×</button>
          </div>
          <div class="suggestions" id="origin-suggestions" role="listbox" hidden></div>
          <p class="field-hint" id="origin-hint" aria-live="polite">
            검색 결과에서 장소를 선택해 주세요.
          </p>
          <span class="connector" aria-hidden="true"></span>
        </div>

        <div class="field" id="destination-field">
          <label for="destination-input">도착지</label>
          <div class="input-wrap">
            <svg class="field-icon destination" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M19 10c0 5.4-7 11-7 11s-7-5.6-7-11a7 7 0 1 1 14 0Z"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.8" />
            </svg>
            <input
              id="destination-input"
              type="text"
              placeholder="예: 부산역"
              autocomplete="off"
              aria-autocomplete="list"
              aria-controls="destination-suggestions"
              aria-describedby="destination-hint"
            />
            <button class="clear-button" type="button" aria-label="도착지 지우기">×</button>
          </div>
          <div class="suggestions" id="destination-suggestions" role="listbox" hidden></div>
          <p class="field-hint" id="destination-hint" aria-live="polite">
            검색 결과에서 장소를 선택해 주세요.
          </p>
        </div>

        <button class="submit-button" id="submit-button" type="submit">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M5 12h14m-6-6 6 6-6 6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          거리 확인하기
        </button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <section class="result" id="result" aria-live="polite" hidden>
        <div class="result-label">자동차 경로 총거리</div>
        <div class="distance-line">
          <span class="distance-value" id="distance-value"></span>
          <span class="distance-unit" id="distance-unit">km</span>
        </div>
        <p class="route-summary" id="route-summary"></p>
        <a class="map-link" id="map-link" href="#" target="_blank" rel="noopener noreferrer">
          지도에서 보기
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M14 5h5v5m-.5-4.5-8 8M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </section>

      <footer>
        장소 검색: <a href="https://nominatim.openstreetmap.org/" target="_blank" rel="noreferrer">Nominatim</a>
        · 지도 데이터: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap contributors</a><br />
        경로: <a href="https://project-osrm.org/" target="_blank" rel="noreferrer">OSRM</a>
      </footer>
    </main>

    <script>
      const endpoints = {
        origin: {
          input: document.querySelector("#origin-input"),
          suggestions: document.querySelector("#origin-suggestions"),
          hint: document.querySelector("#origin-hint"),
          clear: document.querySelector("#origin-field .clear-button"),
          selected: null,
          timer: null,
          controller: null,
          revision: 0,
        },
        destination: {
          input: document.querySelector("#destination-input"),
          suggestions: document.querySelector("#destination-suggestions"),
          hint: document.querySelector("#destination-hint"),
          clear: document.querySelector("#destination-field .clear-button"),
          selected: null,
          timer: null,
          controller: null,
          revision: 0,
        },
      };

      const geocodeCache = new Map();
      let geocodeQueue = Promise.resolve();
      let nextGeocodeAt = 0;
      let routeController = null;

      function setHint(endpoint, message, isError = false) {
        endpoint.hint.textContent = message;
        endpoint.hint.classList.toggle("error", isError);
      }

      function hideSuggestions(endpoint) {
        endpoint.suggestions.hidden = true;
        endpoint.suggestions.replaceChildren();
      }

      function updateClearButton(endpoint) {
        endpoint.clear.classList.toggle("visible", endpoint.input.value.length > 0);
      }

      function formatDisplayName(place) {
        const parts = place.display_name.split(",").map((part) => part.trim());
        return parts.slice(0, 3).join(", ");
      }

      function renderSuggestions(endpoint, places, revision) {
        if (revision !== endpoint.revision) return;
        endpoint.suggestions.replaceChildren();

        for (const place of places) {
          const option = document.createElement("button");
          option.className = "suggestion";
          option.type = "button";
          option.setAttribute("role", "option");

          const name = document.createElement("span");
          name.className = "suggestion-name";
          name.textContent = place.name || formatDisplayName(place);

          const detail = document.createElement("span");
          detail.className = "suggestion-detail";
          detail.textContent = formatDisplayName(place);

          option.append(name, detail);
          option.addEventListener("click", () => {
            endpoint.selected = {
              lat: Number(place.lat),
              lon: Number(place.lon),
              name: place.name || formatDisplayName(place),
              displayName: formatDisplayName(place),
            };
            endpoint.input.value = endpoint.selected.name;
            hideSuggestions(endpoint);
            setHint(endpoint, `선택됨 · ${endpoint.selected.displayName}`);
            updateClearButton(endpoint);
            document.querySelector("#result").hidden = true;
            document.querySelector("#status").textContent = "";
          });
          endpoint.suggestions.append(option);
        }

        endpoint.suggestions.hidden = places.length === 0;
      }

      function geocode(query, signal) {
        const cacheKey = query.toLocaleLowerCase("ko-KR").trim();
        if (geocodeCache.has(cacheKey)) return Promise.resolve(geocodeCache.get(cacheKey));

        const request = geocodeQueue.then(async () => {
          const wait = Math.max(0, nextGeocodeAt - Date.now());
          if (wait) await new Promise((resolve) => setTimeout(resolve, wait));
          if (signal.aborted) throw new DOMException("검색이 취소되었습니다.", "AbortError");

          nextGeocodeAt = Date.now() + 1100;
          const params = new URLSearchParams({
            q: query,
            format: "jsonv2",
            addressdetails: "1",
            limit: "5",
            "accept-language": "ko",
          });
          const response = await fetch(
            `https://nominatim.openstreetmap.org/search?${params.toString()}`,
            { signal, headers: { Accept: "application/json" } },
          );
          if (!response.ok) throw new Error("장소 검색 서버에 연결할 수 없습니다.");
          const places = await response.json();
          geocodeCache.set(cacheKey, places);
          return places;
        });

        geocodeQueue = request.catch(() => {});
        return request;
      }

      for (const endpoint of Object.values(endpoints)) {
        endpoint.input.addEventListener("input", () => {
          const query = endpoint.input.value.trim();
          endpoint.selected = null;
          endpoint.revision += 1;
          const revision = endpoint.revision;

          if (routeController) routeController.abort();
          clearTimeout(endpoint.timer);
          if (endpoint.controller) endpoint.controller.abort();
          hideSuggestions(endpoint);
          document.querySelector("#result").hidden = true;
          document.querySelector("#status").textContent = "";
          updateClearButton(endpoint);

          if (query.length < 2) {
            setHint(endpoint, "검색 결과에서 장소를 선택해 주세요.");
            return;
          }

          setHint(endpoint, "장소를 찾고 있어요...");
          endpoint.timer = setTimeout(async () => {
            const controller = new AbortController();
            endpoint.controller = controller;
            try {
              const places = await geocode(query, controller.signal);
              if (revision !== endpoint.revision) return;
              if (places.length === 0) {
                setHint(endpoint, "검색 결과가 없어요. 다른 이름으로 검색해 보세요.", true);
                return;
              }
              setHint(endpoint, "검색 결과에서 장소를 선택해 주세요.");
              renderSuggestions(endpoint, places, revision);
            } catch (error) {
              if (error.name === "AbortError" || revision !== endpoint.revision) return;
              setHint(endpoint, "검색에 실패했어요. 잠시 후 다시 시도해 주세요.", true);
            }
          }, 450);
        });

        endpoint.clear.addEventListener("click", () => {
          endpoint.input.value = "";
          endpoint.input.dispatchEvent(new Event("input", { bubbles: true }));
          endpoint.input.focus();
        });

        endpoint.input.addEventListener("keydown", (event) => {
          if (event.key === "Escape") hideSuggestions(endpoint);
          if (event.key === "ArrowDown" && !endpoint.suggestions.hidden) {
            event.preventDefault();
            endpoint.suggestions.querySelector(".suggestion")?.focus();
          }
        });
      }

      document.addEventListener("click", (event) => {
        for (const endpoint of Object.values(endpoints)) {
          if (!event.target.closest(`#${endpoint.suggestions.id}`) &&
              !event.target.closest(`#${endpoint.input.id}`)) {
            hideSuggestions(endpoint);
          }
        }
      });

      function formatDistance(meters) {
        if (meters < 1000) {
          return { value: Math.round(meters).toLocaleString("ko-KR"), unit: "m" };
        }
        return {
          value: (meters / 1000).toLocaleString("ko-KR", {
            maximumFractionDigits: 1,
            minimumFractionDigits: 1,
          }),
          unit: "km",
        };
      }

      function formatDuration(seconds) {
        const minutes = Math.round(seconds / 60);
        if (minutes < 60) return `약 ${minutes}분`;
        const hours = Math.floor(minutes / 60);
        const remainder = minutes % 60;
        return remainder ? `약 ${hours}시간 ${remainder}분` : `약 ${hours}시간`;
      }

      document.querySelector("#route-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const status = document.querySelector("#status");
        const button = document.querySelector("#submit-button");
        const result = document.querySelector("#result");
        const origin = endpoints.origin.selected;
        const destination = endpoints.destination.selected;

        if (!origin || !destination) {
          status.classList.add("error");
          status.textContent = "출발지와 도착지를 검색한 뒤, 목록에서 장소를 선택해 주세요.";
          (!origin ? endpoints.origin.input : endpoints.destination.input).focus();
          return;
        }

        if (routeController) routeController.abort();
        routeController = new AbortController();
        const currentController = routeController;
        button.disabled = true;
        button.innerHTML = '<span class="spinner" aria-hidden="true"></span> 경로를 확인하고 있어요';
        status.classList.remove("error");
        status.textContent = "";
        result.hidden = true;

        const coordinates = `${origin.lon},${origin.lat};${destination.lon},${destination.lat}`;
        const params = new URLSearchParams({
          overview: "false",
          alternatives: "false",
          steps: "false",
        });

        try {
          const response = await fetch(
            `https://router.project-osrm.org/route/v1/driving/${coordinates}?${params.toString()}`,
            { signal: currentController.signal },
          );
          if (!response.ok) throw new Error("경로 서버에 연결할 수 없습니다.");

          const data = await response.json();
          if (data.code !== "Ok" || !data.routes || data.routes.length === 0) {
            throw new Error("두 장소를 잇는 자동차 경로를 찾지 못했어요.");
          }

          const route = data.routes[0];
          const distance = formatDistance(route.distance);
          document.querySelector("#distance-value").textContent = distance.value;
          document.querySelector("#distance-unit").textContent = distance.unit;
          document.querySelector("#route-summary").textContent =
            `${origin.name} → ${destination.name} · 예상 ${formatDuration(route.duration)}`;

          const mapParams = new URLSearchParams({
            engine: "fossgis_osrm_car",
            route: `${origin.lat},${origin.lon};${destination.lat},${destination.lon}`,
          });
          document.querySelector("#map-link").href =
            `https://www.openstreetmap.org/directions?${mapParams.toString()}`;
          result.hidden = false;
        } catch (error) {
          if (error.name !== "AbortError" && currentController === routeController) {
            status.classList.add("error");
            status.textContent =
              error.message || "경로를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
          }
        } finally {
          if (currentController === routeController) {
            button.disabled = false;
            button.innerHTML = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> 거리 확인하기`;
          }
        }
      });
    </script>
  </body>
</html>
